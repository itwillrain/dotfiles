"$schema" = 'https://starship.rs/config-schema.json'
palette = "catppuccin_mocha"

format = """
[](fg:surface1)\
$username\
$directory\
${custom.git_clean}\
${custom.git_dirty}\
[](fg:surface1)\
$line_break$character"""

[username]
show_always = true
style_user = "bg:surface1 fg:text"
style_root = "bg:surface1 fg:text"
format = '[ $user ]($style)'
disabled = false

[directory]
style = "bg:surface1 fg:text"
format = '[ $path ]($style)'
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "bg:blue"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:blue"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:teal"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:blue"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:blue"
format = '[ $symbol ($version) ]($style)'

[custom.git_clean]
command = "git branch --show-current"
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -z "$(git status --porcelain)"'
format = '[](fg:surface1 bg:green)[  $output ]($style)[](fg:green bg:surface1)'
style = "bg:green fg:base"

[custom.git_dirty]
command = "git branch --show-current"
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -n "$(git status --porcelain)"'
format = '[](fg:surface1 bg:red)[  $output ]($style)[](fg:red bg:surface1)'
style = "bg:red fg:base"

[character]
success_symbol = '[❯](bold green) '
error_symbol = '[❯](bold red) '
vimcmd_symbol = '[❮](bold green) '
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
