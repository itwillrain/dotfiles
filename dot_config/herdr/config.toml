onboarding = false
[theme]
name = "dracula"

[theme.custom]
sidebar_bg = "#272822"
active_row_bg = "#3e3d32"
selection_bg = "#49483e"
panel_bg = "#272822"
accent = "#a6e22e"
red = "#f92672"
green = "#a6e22e"

[keys]
open_notification_target = "prefix+o"
previous_agent = "prefix+["
next_agent = "prefix+]"

[terminal]
default_shell = "/opt/homebrew/bin/fish"
shell_mode = "auto"

[ui]
agent_panel_sort = "priority"
status_indicators = "symbols"

[ui.toast]
delivery = "herdr"
delay_seconds = 0

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "state_text", bold = true }],
  ["agent"],
  ["$conversation"],
  ["workspace", "tab"],
]
