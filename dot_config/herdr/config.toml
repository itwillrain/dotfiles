[theme]
name = "dracula"

[terminal]
default_shell = "/opt/homebrew/bin/fish"
shell_mode = "auto"

[ui]
agent_panel_sort = "spaces"
status_indicators = "symbols"

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "state_text", bold = true }],
  ["agent"],
  ["$conversation"],
  ["workspace", "tab"],
]
