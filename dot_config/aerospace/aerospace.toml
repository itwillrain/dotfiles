# AeroSpace window management
# https://github.com/nikitabobko/AeroSpace

config-version = 2
start-at-login = true
after-startup-command = [
  'exec-and-forget open -a /Applications/RunCatNeo.app',
]

# AeroSpace workspaces are the primary workspace system. Keep macOS on one
# native Space per monitor to avoid Mission Control and AeroSpace fighting.
automatically-unhide-macos-hidden-apps = true
persistent-workspaces = ["0", "3", "T"]

default-root-container-layout = "tiles"
default-root-container-orientation = "auto"

# Keep only apps with a stable home in predictable workspaces.
# 2: Firefox, 3: VS Code, 9: Figma, 0: Slack, T: Ghostty/Herdr
on-window-detected = [
  { if = 'test %{app-bundle-id} = org.mozilla.firefox', run = 'move-node-to-workspace 2' },
  { if = 'test %{app-bundle-id} = com.microsoft.VSCode', run = 'move-node-to-workspace 3' },
  { if = 'test %{app-bundle-id} = com.figma.Desktop', run = 'move-node-to-workspace 9' },
  { if = 'test %{app-bundle-id} = md.obsidian', run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.apple.finder', run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.mitchellh.ghostty', run = 'move-node-to-workspace T' },
  { if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap', run = 'move-node-to-workspace 0' },
]

# Keep workspaces 1-5 on the built-in display. Fall back to the main display
# when the HDMI monitor is disconnected; workspaces 6-0 stay on the secondary.
[workspace-to-monitor-force-assignment]
1 = ["built-in", "main"]
2 = ["built-in", "main"]
3 = ["built-in", "main"]
4 = ["built-in", "main"]
5 = ["built-in", "main"]
6 = "secondary"
7 = "secondary"
8 = "secondary"
9 = "secondary"
0 = "secondary"
T = "secondary"

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]
# Keymap convention:
# - Command is reserved for actions inside the current app.
# - Option is for cross-app and window-manager actions.
# - Option+Shift moves the focused window, either locally or to another workspace.
# Focus windows
alt-slash = "layout tiles horizontal vertical"
alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"

# Move windows
alt-shift-h = "move left"
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"

# Switch workspaces
alt-t = "workspace T"
alt-0 = "workspace 0"
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
alt-tab = "list-workspaces --monitor focused --empty no | workspace --wrap-around --stdin next"
alt-shift-tab = "list-workspaces --monitor focused --empty no | workspace --wrap-around --stdin prev"

# Switch monitors and move the current workspace between them
alt-n = "focus-monitor --wrap-around next"
alt-p = "focus-monitor --wrap-around prev"
alt-shift-n = "move-workspace-to-monitor --wrap-around next"
alt-shift-p = "move-workspace-to-monitor --wrap-around prev"

# Move the focused window and follow it
alt-shift-t = "move-node-to-workspace T; workspace T"
alt-shift-0 = "move-node-to-workspace 0; workspace 0"
alt-shift-1 = "move-node-to-workspace 1; workspace 1"
alt-shift-2 = "move-node-to-workspace 2; workspace 2"
alt-shift-3 = "move-node-to-workspace 3; workspace 3"
alt-shift-4 = "move-node-to-workspace 4; workspace 4"
alt-shift-5 = "move-node-to-workspace 5; workspace 5"
alt-shift-6 = "move-node-to-workspace 6; workspace 6"
alt-shift-7 = "move-node-to-workspace 7; workspace 7"
alt-shift-8 = "move-node-to-workspace 8; workspace 8"
alt-shift-9 = "move-node-to-workspace 9; workspace 9"

# Common layout and window actions
alt-f = "fullscreen --no-outer-gaps"
alt-shift-space = "layout floating tiling"
alt-r = "mode resize"

[mode.resize.binding]
h = "resize width -50"
j = "resize height +50"
k = "resize height -50"
l = "resize width +50"
minus = "resize smart -50"
equal = "resize smart +50"
esc = "mode main"
enter = "mode main"
