# AeroSpace window management
# https://github.com/nikitabobko/AeroSpace

config-version = 2
start-at-login = true

# AeroSpace workspaces are the primary workspace system. Keep macOS on one
# native Space per monitor to avoid Mission Control and AeroSpace fighting.
automatically-unhide-macos-hidden-apps = true
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

default-root-container-layout = "tiles"
default-root-container-orientation = "auto"

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]
# Focus windows
alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"

# Move windows
alt-shift-h = "move left"
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"

# Switch workspaces
ctrl-1 = "workspace 1"
ctrl-2 = "workspace 2"
ctrl-3 = "workspace 3"
ctrl-4 = "workspace 4"
ctrl-5 = "workspace 5"
ctrl-6 = "workspace 6"
ctrl-7 = "workspace 7"
ctrl-8 = "workspace 8"
ctrl-9 = "workspace 9"

# Move the focused window and follow it
ctrl-shift-1 = "move-node-to-workspace 1; workspace 1"
ctrl-shift-2 = "move-node-to-workspace 2; workspace 2"
ctrl-shift-3 = "move-node-to-workspace 3; workspace 3"
ctrl-shift-4 = "move-node-to-workspace 4; workspace 4"
ctrl-shift-5 = "move-node-to-workspace 5; workspace 5"
ctrl-shift-6 = "move-node-to-workspace 6; workspace 6"
ctrl-shift-7 = "move-node-to-workspace 7; workspace 7"
ctrl-shift-8 = "move-node-to-workspace 8; workspace 8"
ctrl-shift-9 = "move-node-to-workspace 9; workspace 9"

# Common layout and window actions
alt-f = "fullscreen"
alt-shift-space = "layout floating tiling"
alt-r = "mode resize"

[mode.resize.binding]
minus = "resize smart -50"
equal = "resize smart +50"
esc = "mode main"
enter = "mode main"
