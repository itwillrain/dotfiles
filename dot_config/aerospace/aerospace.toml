# AeroSpace window management
# https://github.com/nikitabobko/AeroSpace

config-version = 2
start-at-login = true

# AeroSpace workspaces are the primary workspace system. Keep macOS on one
# native Space per monitor to avoid Mission Control and AeroSpace fighting.
automatically-unhide-macos-hidden-apps = true
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

default-root-container-layout = "tiles"
default-root-container-orientation = "auto"

# Keep frequently used apps in predictable workspaces.
# 1: Chrome, 2: Figma, 3: VS Code, 4: ChatGPT, 5: Ghostty/Herdr, 6: Slack
on-window-detected = [
  { if = 'test %{app-bundle-id} = com.google.Chrome', run = 'move-node-to-workspace 1' },
  { if = 'test %{app-bundle-id} = com.figma.Desktop', run = 'move-node-to-workspace 2' },
  { if = 'test %{app-bundle-id} = com.microsoft.VSCode', run = 'move-node-to-workspace 3' },
  { if = 'test %{app-bundle-id} = com.openai.codex', run = 'move-node-to-workspace 4' },
  { if = 'test %{app-bundle-id} = com.mitchellh.ghostty', run = 'move-node-to-workspace 5' },
  { if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap', run = 'move-node-to-workspace 6' },
]

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]
# Keymap convention:
# - Command is reserved for actions inside the current app.
# - Option is for cross-app and window-manager actions.
# - Option+Shift moves the focused window, either locally or to another workspace.
# Focus windows
alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"

# Move windows
alt-shift-h = "move left"
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"

# Switch workspaces
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"

# Move the focused window and follow it
alt-shift-1 = "move-node-to-workspace 1; workspace 1"
alt-shift-2 = "move-node-to-workspace 2; workspace 2"
alt-shift-3 = "move-node-to-workspace 3; workspace 3"
alt-shift-4 = "move-node-to-workspace 4; workspace 4"
alt-shift-5 = "move-node-to-workspace 5; workspace 5"
alt-shift-6 = "move-node-to-workspace 6; workspace 6"
alt-shift-7 = "move-node-to-workspace 7; workspace 7"
alt-shift-8 = "move-node-to-workspace 8; workspace 8"
alt-shift-9 = "move-node-to-workspace 9; workspace 9"

# Common layout and window actions
alt-f = "fullscreen"
alt-shift-space = "layout floating tiling"
alt-r = "mode resize"

[mode.resize.binding]
minus = "resize smart -50"
equal = "resize smart +50"
esc = "mode main"
enter = "mode main"
