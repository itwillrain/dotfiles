min_version = "2026.7.4"

[settings]
dotfiles.root = "~/gitserver/github.com/itwillrain/dotfiles"
lockfile = true
lockfile_platforms = ["macos-arm64"]
minimum_release_age = "7d"
task.run_auto_install = false

# Machine-wide development runtimes. Projects can override these versions in
# their own mise.toml without changing this repository.
[tools]
aws-cli = "latest"
deno = "latest"
go = "latest"
hunk = "latest"
node = "lts"
python = "latest"
starship = "latest"
zoxide = "latest"

# Keep the workstation baseline intentionally small. Add application-specific
# packages only after they have proved useful on every machine.
[bootstrap.packages]
"brew:bat" = "latest"
"brew:coreutils" = "latest"
"brew:colima" = "latest"
"brew:docker" = "latest"
"brew:docker-compose" = "latest"
"brew:fd" = "latest"
"brew:fish" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:ghq" = "latest"
"brew:git" = "latest"
"brew:git-lfs" = "latest"
"brew:gnupg" = "latest"
"brew:graphviz" = "latest"
"brew:herdr" = "latest"
"brew:imagemagick" = "latest"
"brew:jq" = "latest"
"brew:lsd" = "latest"
"brew:neovim" = "latest"
"brew:pandoc" = "latest"
"brew:ripgrep" = "latest"
"brew:terminal-notifier" = "latest"
"brew:tig" = "latest"
"brew:tokei" = "latest"
"brew:yq" = "latest"

# The repository keeps chezmoi source names for a low-risk migration. mise
# links them directly, so new changes no longer depend on `chezmoi apply`.
[dotfiles]
"~/.config/aerospace/aerospace.toml" = { source = "~/gitserver/github.com/itwillrain/dotfiles/dot_config/aerospace/aerospace.toml", mode = "symlink" }
"~/.config/fish" = { source = "~/gitserver/github.com/itwillrain/dotfiles/dot_config/fish", mode = "symlink" }
"~/.config/herdr/config.toml" = { source = "~/gitserver/github.com/itwillrain/dotfiles/dot_config/herdr/config.toml", mode = "symlink" }
"~/.config/git" = { source = "~/gitserver/github.com/itwillrain/dotfiles/dot_config/git", mode = "symlink" }
"~/.config/karabiner/karabiner.json" = { source = "~/gitserver/github.com/itwillrain/dotfiles/dot_config/private_karabiner/private_karabiner.json", mode = "symlink" }
"~/.config/mise/config.toml" = { source = "~/gitserver/github.com/itwillrain/dotfiles/mise.toml", mode = "symlink" }
"~/.config/nvim" = { source = "~/gitserver/github.com/itwillrain/dotfiles/dot_config/nvim", mode = "symlink" }
"~/.config/starship.toml" = { source = "~/gitserver/github.com/itwillrain/dotfiles/dot_config/starship.toml", mode = "symlink" }
"~/.gitconfig" = { source = "~/gitserver/github.com/itwillrain/dotfiles/dot_gitconfig", mode = "symlink" }
"~/.ideavimrc" = { source = "~/gitserver/github.com/itwillrain/dotfiles/dot_ideavimrc", mode = "symlink" }
"~/.ssh/config" = { source = "~/gitserver/github.com/itwillrain/dotfiles/dot_ssh/config", mode = "symlink" }
"~/.tigrc" = { source = "~/gitserver/github.com/itwillrain/dotfiles/dot_tigrc", mode = "symlink" }
"~/Library/Application Support/com.mitchellh.ghostty/config.ghostty" = { source = "~/gitserver/github.com/itwillrain/dotfiles/dot_config/ghostty/config.ghostty", mode = "symlink" }
"~/Library/Application Support/Code/User/keybindings.json" = { source = "~/gitserver/github.com/itwillrain/dotfiles/vscode/keybindings.json", mode = "symlink" }
"~/Library/Application Support/Code/User/settings.json" = { source = "~/gitserver/github.com/itwillrain/dotfiles/vscode/settings.json", mode = "symlink" }

[bootstrap.brew]
adopt = true

[bootstrap.macos.dock]
autohide = true
orientation = "right"
magnification = true
mru_spaces = false

[bootstrap.macos.finder]
preferred_view_style = "list"

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = false

[bootstrap.macos.defaults]
"NSGlobalDomain" = { AppleShowAllExtensions = true, ApplePressAndHoldEnabled = "0" }
"com.apple.dock" = { tilesize = 36.0, largesize = 16.0, "minimize-to-application" = false }
"com.apple.finder" = { AppleShowAllFiles = "TRUE" }

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

[tasks."macos:aerospace"]
description = "Disable Mission Control shortcuts that conflict with AeroSpace"
run = '''
tmp_path="$(mktemp "${TMPDIR:-/tmp}/mise-symbolic-hotkeys.XXXXXX")"
trap 'rm -f "$tmp_path"' EXIT
defaults export com.apple.symbolichotkeys "$tmp_path"

for hotkey_id in 118 119 120 121 122 123 124 125 126; do
    /usr/libexec/PlistBuddy -c "Set :AppleSymbolicHotKeys:${hotkey_id}:enabled false" "$tmp_path"
done

defaults import com.apple.symbolichotkeys "$tmp_path"
killall SystemUIServer >/dev/null 2>&1 || true
'''

[tasks.check]
description = "Validate the declarative workstation configuration"
run = ["mise fmt --check", "mise bootstrap status"]

[tasks."vscode:install"]
description = "Install the curated VS Code extensions"
depends = ["visual-studio-code:install"]
run = "xargs -n 1 code --install-extension < \"$MISE_ORIGINAL_CWD/vscode/extensions\""

[tasks.bootstrap]
depends = [
  "aerospace:install",
  "alt-tab:install",
  "chatgpt:install",
  "figma:install",
  "fonts:install",
  "google-chrome:install",
  "google-japanese-ime:install",
  "ghostty:install",
  "karabiner-elements:install",
  "macos:aerospace",
  "obsidian:install",
  "raycast:install",
  "vscode:install",
  "visual-studio-code:install",
]

# Some casks do not publish the API metadata that mise's direct brew-cask
# backend expects, so install them through Homebrew tasks.
[tasks."aerospace:install"]
description = "Install AeroSpace via its official Homebrew tap"
run = "test -d /Applications/AeroSpace.app || brew install --cask nikitabobko/tap/aerospace"

[tasks."alt-tab:install"]
description = "Install AltTab through Homebrew"
run = "test -d /Applications/AltTab.app || brew install --cask alt-tab"

[tasks."chatgpt:install"]
description = "Install ChatGPT through Homebrew"
run = "test -d /Applications/ChatGPT.app || brew install --cask chatgpt"

[tasks."ghostty:install"]
description = "Install Ghostty through Homebrew"
run = "test -d /Applications/Ghostty.app || brew install --cask ghostty"

[tasks."figma:install"]
description = "Install Figma through Homebrew"
run = "test -d /Applications/Figma.app || brew install --cask figma"

[tasks."google-chrome:install"]
description = "Install Google Chrome through Homebrew"
run = "test -d '/Applications/Google Chrome.app' || brew install --cask google-chrome"

[tasks."google-japanese-ime:install"]
description = "Install Google Japanese Input through Homebrew"
run = "test -d '/Library/Input Methods/GoogleJapaneseInput.app' || brew install --cask google-japanese-ime"

[tasks."fonts:install"]
description = "Install configured fonts through Homebrew"
run = '''
test -e "$HOME/Library/Fonts/SauceCodeProNerdFont-Regular.ttf" -o -e "/Library/Fonts/SauceCodeProNerdFont-Regular.ttf" || brew install --cask font-sauce-code-pro-nerd-font
test -e "$HOME/Library/Fonts/UDEVGothicNFLG-Regular.ttf" -o -e "/Library/Fonts/UDEVGothicNFLG-Regular.ttf" || brew install --cask font-udev-gothic-nf
'''

[tasks."karabiner-elements:install"]
description = "Install Karabiner-Elements through Homebrew"
run = "test -d /Applications/Karabiner-Elements.app || brew install --cask karabiner-elements"

[tasks."obsidian:install"]
description = "Install Obsidian through Homebrew"
run = "test -d /Applications/Obsidian.app || brew install --cask obsidian"

[tasks."raycast:install"]
description = "Install Raycast through Homebrew"
run = "test -d /Applications/Raycast.app || brew install --cask raycast"

[tasks."visual-studio-code:install"]
description = "Install Visual Studio Code through Homebrew"
run = "test -d '/Applications/Visual Studio Code.app' || brew install --cask visual-studio-code"

[tasks."agents:setup"]
description = "Install the Codex integration for Herdr"
run = "herdr integration install codex"
